aid: brave-browser
url: https://raw.githubusercontent.com/api-evangelist/brave-browser/refs/heads/main/apis.yml
name: Brave
kind: company
description: Brave Software builds a privacy-first Chromium-based browser, an independent search engine (Brave Search),
  an in-browser AI assistant (Leo), a video conferencing product (Brave Talk), an opt-in attention economy (Brave
  Rewards / Basic Attention Token), a wallet (Brave Wallet), and a privacy advertising platform (Brave Ads). Developer-facing
  APIs are concentrated in the Brave Search API (api.search.brave.com), which exposes web, news, image, video, suggest,
  spellcheck, summarizer, and local POI endpoints authenticated via X-Subscription-Token. Browser code is open source
  under MPL-2.0 on GitHub.
